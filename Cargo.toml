[package]
name = "ai-playground"
version = "0.4.0"
edition = "2024"

[workspace]
members = ["crates/aiteach-compat"]

[lib]
name = "ai_playground"
path = "src/lib.rs"

[[bin]]
name = "ai"
path = "src/bin/ai.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
keyring = "3.6.3"
reqwest = { version = "0.12.28", features = ["json", "native-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net"] }
toml = "0.8.23"
uuid = { version = "1.23.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
