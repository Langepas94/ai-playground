[package]
name = "ai-playground"
version = "0.2.1"
edition = "2024"
default-run = "ai"

[workspace]
members = [".", "crates/aiteach-compat"]

[[bin]]
name = "ai-playground"
path = "src/main.rs"

[[bin]]
name = "ai"
path = "src/bin/ai.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
directories = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
